<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPLEIDING | INZICHTEN</title><style>body{font:14px system-ui;background:#1e242b;color:#edf2f7;max-width:1200px;margin:auto;padding:20px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px;border:1px solid #3d4855;background:#28323d;border-radius:10px}.card strong{font-size:29px;display:block}.muted{color:#abb8c4}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #45505a;padding:10px}a{color:#b5d8ff}button{background:#354254;border:1px solid #697889;color:white;border-radius:6px;padding:10px;cursor:pointer}@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><h1>OPLEIDING | INZICHTEN</h1><p class="muted">Gekoppelde opleidingen en hun voortgang. Niet-geregistreerde oudere kaarten worden niet meegeteld.</p><div class="grid"><div class="card">In opleiding<strong id="active">–</strong></div><div class="card">Afgerond<strong id="complete">–</strong></div><div class="card">Voortijdig gestopt<strong id="stopped">–</strong></div><div class="card">Totaal<strong id="total">–</strong></div></div><p><button id="refresh">Vernieuwen</button> <span id="message" class="muted">Laden…</span></p><table><thead><tr><th>Medewerker</th><th>Status</th><th>Stappen</th><th>Kaart</th></tr></thead><tbody id="rows"></tbody></table><script src="https://p.trellocdn.com/power-up.min.js"></script><script>
(async()=>{const t=window.TrelloPowerUp.iframe(),$=id=>document.getElementById(id);async function load(){try{const jwt=await t.jwt({state:JSON.stringify({action:'core-training-dashboard'})});const r=await fetch('https://nktr-employee-core.marice-angulo.workers.dev/v1/training/dashboard',{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(45000)});const d=await r.json();if(!r.ok)throw Error(d.error||'Niet beschikbaar');for(const [i,v]of [['total',d.total],['active',d.active],['complete',d.completed],['stopped',d.stopped]])$(i).textContent=v;$('rows').replaceChildren();for(const v of d.rows||[]){const tr=document.createElement('tr');for(const x of [v.employee||'—',v.state,`${v.done||0}/${v.total||0}`]){const cell=document.createElement('td');cell.textContent=x;tr.append(cell)}const td=document.createElement('td'),link=document.createElement('a');link.href='https://trello.com/c/'+v.card_id;link.textContent='Bekijk kaart';link.rel='noopener noreferrer';link.target='_blank';td.append(link);tr.append(td);$('rows').append(tr)}$('message').textContent=d.total===0?'Er zijn nog geen gekoppelde opleidingen. Wijs een opleiding toe vanuit de Onboarding-medewerkerkaart.':'Bijgewerkt'}catch(e){$('message').textContent=e.message}}$('refresh').onclick=load;await load()})();
</script></body></html>
