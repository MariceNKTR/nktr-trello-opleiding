<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>NKTR Opleiding | Connector</title></head><body><script src="https://p.trellocdn.com/power-up.min.js"></script><script>
'use strict';const ROOT='https://maricenktr.github.io/nktr-trello-opleiding/';function modal(t,what,title,h=580){return t.modal({url:ROOT+what,title,height:h})}window.TrelloPowerUp.initialize({
'board-buttons':()=>[
  {text:'INZICHTEN',condition:'edit',callback:t=>modal(t,'dashboard.html','OPLEIDING | INZICHTEN',820)},

],
'card-back-section':function(t){return {title:'IDENTITEIT / CONTROLE',icon:ROOT+'identity-icon.svg',content:{type:'iframe',url:t.signUrl('./identity.html'),height:580}};},
'card-buttons':async t=>{const c=await t.card('name');if(/^\s*OPL\s*\|/i.test(c.name||''))return[];return[{text:'Volgende fase',condition:'edit',callback:t=>modal(t,'actie.html?mode=advance','Naar volgende fase')},{text:'Opleiding afronden',condition:'edit',callback:t=>modal(t,'actie.html?mode=complete','Opleiding afronden')},{text:'Voortijdig stoppen',condition:'edit',callback:t=>modal(t,'actie.html?mode=stop','Opleiding stoppen')}];},
'card-detail-badges':async t=>{try{const card=await t.card('id');const jwt=await t.jwt({state:JSON.stringify({action:'core-training-status'})});const r=await fetch('https://nktr-employee-core.marice-angulo.workers.dev/v1/training/status',{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify({cardId:card.id}),signal:AbortSignal.timeout(5000)});if(!r.ok)return[];const d=await r.json();const badges=[{title:'OPLEIDING VOORTGANG',text:d.progress+'% · '+d.state,color:d.state==='COMPLETED'?'green':undefined}];if(d.state==='ACTIVE'){if(d.can_advance)badges.push({title:'VOLGENDE STAP',text:'Naar volgende fase',callback:t=>modal(t,'actie.html?mode=advance','Naar volgende fase')});if(d.can_complete)badges.push({title:'OPLEIDING AFRONDEN',text:'Afronden',callback:t=>modal(t,'actie.html?mode=complete','Opleiding afronden')});badges.push({title:'OPLEIDING STOPPEN',text:'Voortijdig stoppen',callback:t=>modal(t,'actie.html?mode=stop','Opleiding stoppen')})}return badges}catch{return[]}}
});
</script></body></html>
