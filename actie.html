<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPLEIDING | Actie</title><style>body{font:14px system-ui;background:#21272e;color:#eaeff5;padding:18px}button,textarea{font:inherit;border:1px solid #627081;background:#303b48;color:#f5f8fb;padding:10px;border-radius:7px}button{cursor:pointer}textarea{display:block;width:100%;height:100px;margin:12px 0}p{color:#aab6c4}.notice{padding:13px;background:#303946;border-radius:7px}</style></head><body><h1 id="heading">Opleiding</h1><p id="info">De originele Onboarding-kaart blijft intact.</p><div id="progress" class="notice">Kaart controleren…</div><label id="reasonBox" hidden>Reden voor stoppen (verplicht): <textarea id="reason" minlength="10" maxlength="500"></textarea></label><p><button id="confirm" disabled>BEVESTIGEN</button></p><div id="message"></div><script src="https://p.trellocdn.com/power-up.min.js"></script><script>
(async()=>{const t=window.TrelloPowerUp.iframe(),$=id=>document.getElementById(id),mode=new URLSearchParams(location.search).get('mode'),core='https://nktr-employee-core.marice-angulo.workers.dev',map={advance:['Volgende fase','core-training-advance'],complete:['Opleiding afronden','core-training-complete'],stop:['Voortijdig stoppen','core-training-stop']};if(!map[mode])return;$('heading').textContent=map[mode][0];$('reasonBox').hidden=mode!=='stop';const cardId=(await t.card('id')).id;async function call(path,action,payload){const jwt=await t.jwt({state:JSON.stringify({action})});const r=await fetch(core+path,{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(25000)});const x=await r.json();if(!r.ok)throw Error(x.error||'Niet beschikbaar');return x}try{const s=await call('/v1/training/status','core-training-status',{cardId});$('progress').textContent=`${s.list} · ${s.completed}/${s.total} stappen · ${s.progress}% · ${s.state}`;$('confirm').disabled=s.state!=='ACTIVE'}catch(e){$('progress').textContent='Kaart niet gekoppeld: '+e.message} $('confirm').onclick=async()=>{const reason=$('reason').value.trim();if(mode==='stop'&&reason.length<10){$('message').textContent='Reden van minimaal 10 tekens vereist';return}if(!confirm('Deze Opleiding-actie uitvoeren?'))return;$('confirm').disabled=true;try{const act=mode==='advance'?'advance':mode==='complete'?'complete':'stop';const x=await call('/v1/training/'+act,map[mode][1],{cardId,reason});$('message').textContent='Verwerkt: '+x.status;await t.alert({message:'OPLEIDING bijgewerkt'});await t.closeModal()}catch(e){$('message').textContent=e.message;$('confirm').disabled=false}}})();
</script></body></html>
