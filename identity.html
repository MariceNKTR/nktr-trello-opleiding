<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NKTR · Identiteitscontrole</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#eeebf4;background:transparent}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-width:0;overflow-x:hidden}
body{padding:3px 4px 7px;font-size:12px;line-height:1.3}
.panel{border:1px solid #9871c5;border-radius:15px;background:linear-gradient(125deg,#241c31 0%,#1c1926 55%,#211829 100%);box-shadow:0 0 0 1px rgba(174,134,219,.08),0 4px 14px rgba(0,0,0,.13);padding:8px 10px 7px;max-width:100%;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:flex-start;gap:9px;border-bottom:1px solid rgba(200,179,229,.20);padding:0 0 6px;margin:0 0 7px;min-width:0}
.brand-logo{display:block;width:77px;height:30px;flex:none;overflow:visible}
.brand-divider{height:25px;width:1px;background:#9074ad;opacity:.8;flex:none}
.section-note{font-size:12px;font-weight:500;color:#f0eaf7;white-space:nowrap}
.notice{display:flex;align-items:center;min-height:30px;padding:5px 9px;border:1px solid #5f4977;border-radius:9px;background:linear-gradient(90deg,#4e3a65,#3b2c51);font-weight:650;color:#f5f2f9;line-height:1.2;gap:8px}
.notice::before{content:'ⓘ';font-size:14px;font-weight:400;color:#ded3ed;line-height:1}
.notice.warning{background:linear-gradient(90deg,#62412f,#473326);border-color:#8b6441}
.notice.success{background:linear-gradient(90deg,#274c45,#243b37);border-color:#467d6b}
.meta{font-size:12px;color:#d1c7db;margin:5px 3px 4px}
.muted{color:#cec3d7}
#candidates{margin:0 3px 5px;color:#d5ccde}
#candidates>p{font-size:12px;margin:2px 0 5px;line-height:1.25}
.candidate{padding:5px 0;border-bottom:1px solid rgba(203,187,219,.18);font-size:12px}
.candidate a{color:#d0b7ff;text-decoration:underline;font-size:12px}
label{display:block;margin:5px 0 3px;font-size:12px;font-weight:650;color:#ebe4f3}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) 111px;gap:8px;align-items:stretch}
button,select{font:inherit;font-size:12px;border-radius:7px;border:1px solid #877991;padding:5px 8px;min-height:29px;margin:0;width:100%;color:#ede6f6;background:#2a2632}
select{min-width:0;appearance:auto;cursor:pointer;color:#efecf2;background:#292531}
select:focus,button:focus-visible,summary:focus-visible{outline:2px solid #b793eb;outline-offset:1px}
button{cursor:pointer;font-weight:550}
button.primary{border-color:#8a60c0;background:linear-gradient(180deg,#6d49aa,#503184);color:white;font-weight:650}
button.secondary{border-color:#82758e;background:linear-gradient(180deg,#33303c,#292530);color:#f2ecf7}
button:hover:not(:disabled){filter:brightness(1.13)}
button:disabled,select:disabled{opacity:.48;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
#err{color:#ffc4c4;white-space:pre-wrap;font-size:12px;margin:6px 0}
#info{white-space:pre-wrap}
#coreArea{margin-top:8px;padding-top:7px;border-top:1px solid rgba(202,176,224,.26);font-size:12px}
#coreArea summary{font-size:12px;font-weight:650;color:#f2e9fc;cursor:pointer;list-style:revert}
#coreInfo{font-size:12px;color:#d5c9df;margin:5px 0}
#coreArea button,#archive-area button{margin:5px 0}
#coreArea select,#archive-area select{margin-bottom:5px}
#archive-area{margin-top:6px;padding-top:6px;border-top:1px solid rgba(200,179,229,.20)}
#archive-area p{font-size:12px;color:#d6c6df;margin:3px 0}
.hidden,[hidden]{display:none!important}
#content{margin:0}
@media(max-width:360px){.link-row{grid-template-columns:minmax(0,1fr) 88px;gap:5px}.brand-logo{width:68px;height:27px}.panel{padding:7px}.row{gap:5px}}
</style>
</head><body>

</div>
<div id="info" class="notice">Identiteit controleren…</div>
<div id="err" role="alert" hidden></div>
<section id="content" class="hidden">
  <div class="meta" id="age"></div>
  <div id="candidates"></div>
  <label for="onb">Onboarding-record</label>
  <div class="link-row"><select id="onb" aria-label="Onboarding-record"><option value="">Kies ONB-kaart</option></select>
  <button id="link" class="primary">Koppelen</button></div>
  <div id="archive-area" class="hidden">
    <label for="opl">Bestaande Opleiding-kaart behouden</label>
    <select id="opl"><option value="">Selecteer de kaart die moet blijven</option></select>
    <button id="archive" class="secondary">Archiveer deze dubbele kaart</button>
    <p>Alleen binnen 24 uur, uitsluitend als er geen afgeronde stappen of opmerkingen zijn. Geen permanente verwijdering.</p>
  </div>
  <div class="row">
    <button id="review" class="secondary">Admincontrole</button>
    <button id="refresh" class="secondary">Vernieuwen</button>
  </div>
  <details id="coreArea"><summary>Gekoppelde processen</summary>
    <p id="coreInfo">Registratie wordt gecontroleerd...</p>
    <button id="coreRegister" class="secondary hidden">Registreer unieke ONB-identiteit</button>
    <div id="coreProcess" class="hidden">
      <label for="coreDest">Verwijs medewerker naar</label>
      <select id="coreDest"><option value="">Kies ALG-bord</option></select>
      <button id="corePreview" class="secondary">Controleer koppeling</button>
      <button id="coreCreate" disabled>Maak gekoppeld proces</button>
    </div>
  </details>

</section>
</main>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
'use strict';
const API='https://nktr-employee-core-stage.marice-angulo.workers.dev/api/identity/';
const t=window.TrelloPowerUp.iframe();const $=id=>document.getElementById(id);
let state=null,cardId=null,busy=false,referralPreview=null,coreRegistered=false;
// An empty string clears an error. It must NOT become 'Onbekende fout'.
function showError(err){
 const message=typeof err==='string'?err:(err?.message||String(err??''));
 $('err').textContent=message.trim();
 $('err').hidden=!message.trim();
 fitPanel();
}
function fitPanel(){
 // Official Trello iframe API. Resize to content rather than leaving a blank 580px block.
 requestAnimationFrame(()=>{try{Promise.resolve(t.sizeTo(document.body)).catch(()=>{});}catch(_e){}});
}
async function call(action,data={}){
 const jwt=await t.jwt({state:JSON.stringify({action:'v46-'+action,cardId})});
 const r=await fetch(API+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jwt},body:JSON.stringify({cardId,...data})});
 let value;try{value=await r.json()}catch{throw new Error('Serverantwoord niet leesbaar')};if(!r.ok)throw new Error(value.error||`HTTP ${r.status}`);return value;
}
async function coreCall(action,data={}){
 const jwt=await t.jwt({state:JSON.stringify({action:'v45-'+action,cardId})});
 const r=await fetch(API.replace('/identity/','/core/')+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jwt},body:JSON.stringify({cardId,...data})});
 let v;try{v=await r.json()}catch{throw Error('Employee Core antwoord ontbreekt')};if(!r.ok)throw new Error(v.error||`HTTP ${r.status}`);return v;
}
async function loadCore(){
 const card=state?.card;if(!card)return;
 const dest=$('coreDest');dest.replaceChildren();const opt=document.createElement('option');opt.value='';opt.textContent='Kies ALG-bord';dest.append(opt);
 for(const c of ['ONB','OPL','HRM','OPS','PLN','PIK','TAK','PRJ','VGD','BAC','FIN','FAC'].filter(c=>c!==card.board)){const o=document.createElement('option');o.value=c;o.textContent=c;dest.append(o)}
 try{
  const c=await coreCall('card',{cardId});coreRegistered=true;
  $('coreInfo').textContent='Medewerker: '+c.employee.name+' · '+c.relationships.map(r=>r.name+' ('+r.state+')').join(', ')+' · gekoppelde kaarten: '+c.registrations.map(r=>r.board_code).join(', ');
  $('coreProcess').classList.remove('hidden');$('coreRegister').classList.add('hidden');
 }catch(e){coreRegistered=false;$('coreProcess').classList.add('hidden');
  $('coreInfo').textContent='Nog niet in Employee Core geregistreerd. '+e.message;
  $('coreRegister').classList.toggle('hidden',!state?.mayRegisterCore);
 }finally{fitPanel();}
}
function option(parent,item){const o=document.createElement('option');o.value=item.cardId;o.textContent=item.name+' · '+item.score+'/100'+(item.archived?' · historisch':'');parent.append(o)}
function text(parent,text,tag='div',css=''){const el=document.createElement(tag);el.textContent=text;if(css)el.className=css;parent.append(el);return el}
function update(){if(!state)return;const d=state;
 $('content').classList.remove('hidden');const linked=d.linkedOnboarding;
 const bestScore=Math.max(0,...(d.candidates||[]).map(c=>Number(c.score)||0));
 const duplicateLabel=bestScore?`Mogelijke dubbel · ${Math.round(bestScore)}/100 · controle nodig`:'Mogelijke dubbel · controle nodig';
 const explain=d.signal==='LINKED'?'Gekoppeld aan Onboarding':d.signal==='REGISTERED'?'Geregistreerd in Employee Core':d.signal==='STRONG'||d.signal==='POSSIBLE'?duplicateLabel:'Nog geen identiteit bevestigd';
 $('info').textContent=explain+(d.review?.status==='OPEN'?' · admincontrole aangevraagd':'');
 $('info').classList.toggle('warning',d.signal==='STRONG'||d.signal==='POSSIBLE');
 $('info').classList.toggle('success',d.signal==='LINKED'||d.signal==='REGISTERED');
 $('age').textContent=d.createdAt?'Aangemaakt: '+new Date(d.createdAt).toLocaleString('nl-NL')+' · '+(d.within24Hours?'Binnen 24 uur':'Na 24 uur'): 'Aanmaaktijd niet betrouwbaar vast te stellen · admincontrole verplicht';
 const box=$('candidates');box.replaceChildren();const onb=$('onb'),opl=$('opl');onb.replaceChildren();opl.replaceChildren();const z=document.createElement('option');z.value='';z.textContent='Kies ONB-kaart';onb.append(z);const z2=document.createElement('option');z2.value='';z2.textContent='Kies bestaande OPL-kaart';opl.append(z2);
 for(const c of d.candidates){const div=document.createElement('div');div.className='candidate';text(div,`${c.board} · ${c.name} · ${c.score}/100${c.archived?' (historisch)':''}`);const a=text(div,'Open Trello-kaart','a');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';box.append(div);if(!c.archived&&c.board==='ONB')option(onb,c);if(!c.archived&&c.board==='OPL'&&c.score>=92)option(opl,c)}
 if(d.restrictedMatches)text(box,'Aanvullende matches op beperkt toegankelijke borden. Vraag admincontrole voor een volledige beoordeling.','p','muted');
 if(!d.candidates.length)text(box,'Geen vergelijkbare ONB/OPL-kaarten gevonden.','p','muted');
 $('archive-area').classList.toggle('hidden',d.card.board!=='OPL'||opl.options.length<2);
 const canResolve=d.resolutionEnabled&&d.card.board==='OPL'&&(d.within24Hours||d.adminMayResolve)&&!linked;
 onb.disabled=!canResolve;$('link').disabled=!canResolve;
 $('archive').disabled=!canResolve;$('review').disabled=d.review?.status==='OPEN';
 if(linked){text(box,'Gekoppeld aan ONB: '+linked,'p','muted');}
 fitPanel();
}
async function refresh(){showError('');$('info').textContent='Controleren…';state=await call('inspect');update();await loadCore()}
async function action(task,data,confirmation){if(busy)return;if(confirmation&&!confirm(confirmation))return;busy=true;showError('');try{const result=await call(task,data);$('info').textContent=JSON.stringify(result);await refresh()}catch(err){showError(err)}finally{busy=false}}
$('link').addEventListener('click',()=>{const id=$('onb').value;if(!id)return showError('Kies eerst een ONB-kaart');action('resolve',{onboardingCardId:id,mode:'LINK'},'Koppel aan deze bestaande Onboarding-identiteit? Dit wist geen werk.');});
$('archive').addEventListener('click',()=>{const id=$('onb').value,target=$('opl').value;if(!id||!target)return showError('Selecteer een ONB-identiteit én bestaande OPL-kaart om te behouden.');action('resolve',{onboardingCardId:id,existingOplCardId:target,mode:'ARCHIVE_DUPLICATE'},'Dubbele kaart ARCHIVEREN? De bestaande OPL-kaart blijft bewaard. Afgeronde stappen blokkeren archivering.');});
$('review').addEventListener('click',()=>action('review',{reason:'Controle mogelijke dubbele medewerkeridentiteit'},'Vraag een administrator om identiteit te controleren?'));
$('coreRegister').addEventListener('click',async()=>{if(busy)return;busy=true;showError('');try{
 const p=await coreCall('preflight',{cardId});if(!confirm('Registreer nieuwe, gecontroleerde ONB-medewerker '+p.name+' bij '+p.company+'?'))return;
 const r=await coreCall('register',{previewId:p.previewId,confirm:'REGISTER VERIFIED EMPLOYEE'});$('coreInfo').textContent='GEREGISTREERD: '+r.employeeId;await loadCore();
 }catch(e){showError(e)}finally{busy=false}});
$('coreDest').addEventListener('change',()=>{$('coreCreate').disabled=true;referralPreview=null});
$('corePreview').addEventListener('click',async()=>{showError('');try{const dest=$('coreDest').value;if(!dest)throw Error('Kies een ALG-bord');const r=await coreCall('referral-preview',{sourceCardId:cardId,destinationCode:dest});referralPreview=r.previewId;$('coreInfo').textContent='KOPPELING GECONTROLEERD: '+r.employee+' · '+r.from+' → '+r.destination+' · '+r.targetList;$('coreCreate').disabled=false;}catch(err){showError(err)}});
$('coreCreate').addEventListener('click',async()=>{if(!referralPreview)return;if(!confirm('Maak dit gekoppelde proces aan in Trello?'))return;const id=referralPreview;referralPreview=null;$('coreCreate').disabled=true;try{const r=await coreCall('referral-create',{previewId:id,confirm:'CREATE LINKED PROCESS'});$('coreInfo').textContent='RESULTAAT: '+r.status+(r.url?' · '+r.url:'')+(r.error?' · '+r.error:'');await loadCore()}catch(e){showError(e)}});
$('refresh').addEventListener('click',()=>refresh().catch(showError));
$('coreArea').addEventListener('toggle',fitPanel);
(async()=>{try{const c=await t.card('id');cardId=c.id;await refresh()}catch(err){showError(err);$('info').textContent='Identiteitscontrole momenteel niet beschikbaar.';fitPanel()}})();
</script></body></html>
